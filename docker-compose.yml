services:
  doctors-service:
    build: ./services/doctors
    ports:
      - "8002:8002"

  patient-service:
    build: ./services/patient
    ports:
      - "8001:8001"

  notification-service:
    build: ./services/notification
    ports:
      - "8005:8005"

  referral-service:
    build: ./services/referral
    ports:
      - "8003:8003"
    environment:
      DOCTORS_SERVICE_URL: http://doctors-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      PHARMACY_SERVICE_URL: http://pharmacy-service:8006
    depends_on:
      - doctors-service
      - notification-service
      - pharmacy-service

  document-service:
    build: ./services/document
    ports:
      - "8004:8004"
    volumes:
      - document-uploads:/app/uploads

  appointment-service:
    build: ./services/appointments
    ports:
      - "8007:8007"

  questionnaire-service:
    build: ./services/questionnaire
    ports:
      - "8008:8008"

  pharmacy-service:
    build: ./services/pharmacy
    ports:
      - "8006:8006"
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8001
    depends_on:
      - patient-service

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8001
      DOCTORS_SERVICE_URL: http://doctors-service:8002
      REFERRAL_SERVICE_URL: http://referral-service:8003
      DOCUMENT_SERVICE_URL: http://document-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      APPOINTMENT_SERVICE_URL: http://appointment-service:8007
      QUESTIONNAIRE_SERVICE_URL: http://questionnaire-service:8008
      PHARMACY_SERVICE_URL: http://pharmacy-service:8006
    depends_on:
      - patient-service
      - doctors-service
      - referral-service
      - document-service
      - notification-service
      - appointment-service
      - questionnaire-service
      - pharmacy-service

volumes:
  document-uploads:
