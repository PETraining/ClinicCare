<div class="document-list">
  <div class="header-row">
    <h2>My Documents</h2>
    <a routerLink="/documents/upload">Upload a document</a>
  </div>

  <p *ngIf="documents().length === 0">No documents yet.</p>

  <table *ngIf="documents().length > 0">
    <thead>
      <tr>
        <th>File name</th>
        <th>Type</th>
        <th>Uploaded</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let doc of documents()">
        <td>{{ doc.FileName }}</td>
        <td>{{ doc.Type }}</td>
        <td>{{ doc.UploadedDate }}</td>
        <td>
          <button type="button" [disabled]="!doc.FilePath" (click)="download(doc.DocumentId, doc.FileName)">
            Download
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
