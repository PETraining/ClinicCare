<div class="questionnaire-form" *ngIf="questionnaire() as qn">
  <h2>{{ qn.Title }}</h2>

  <form (ngSubmit)="submit()">
    <div class="question" *ngFor="let q of qn.questions">
      <label>{{ q.QuestionText }}</label>

      <input
        *ngIf="q.Type === 'text'"
        type="text"
        name="q-{{ q.QuestionId }}"
        [(ngModel)]="answers[q.QuestionId]"
      />

      <select
        *ngIf="q.Type === 'choice'"
        name="q-{{ q.QuestionId }}"
        [(ngModel)]="answers[q.QuestionId]"
      >
        <option value="" disabled>Select an answer</option>
        <option *ngFor="let choice of q.Choices" [value]="choice">{{ choice }}</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Submitting...' : 'Submit' }}
      </button>
      <a routerLink="/questionnaires">Cancel</a>
    </div>
  </form>
</div>
