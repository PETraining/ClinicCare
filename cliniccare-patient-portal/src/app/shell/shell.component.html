<div class="shell">
  <header class="shell-header">
    <h1>ClinicCare Patient Portal</h1>
    <div class="shell-header-right">
      <span>{{ currentPatientName }}</span>
      <button type="button" (click)="switchPatient()">Switch patient</button>
    </div>
  </header>
  <div class="shell-body">
    <nav class="shell-nav">
      <a routerLink="/documents">Documents</a>
      <a routerLink="/questionnaires">Questionnaires</a>
    </nav>
    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
