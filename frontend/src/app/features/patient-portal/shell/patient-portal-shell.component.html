<header class="topbar">
  <div class="brand">ReferralIQ — Patient Portal</div>
  <nav>
    <a routerLink="/patient-portal/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/patient-portal/documents" routerLinkActive="active">Documents</a>
    <a routerLink="/patient-portal/questionnaires" routerLinkActive="active">Questionnaires</a>
    <a routerLink="/patient-portal/notifications" routerLinkActive="active">Notifications</a>
  </nav>
  <div class="user">
    <span>{{ patientAuth.currentPatient()?.patientName }}</span>
    <button (click)="logout()">Log out</button>
  </div>
</header>
<main class="content">
  <router-outlet></router-outlet>
</main>
